# /etc/security/faillock.conf — bloqueo temporal tras intentos fallidos (3B.2, ADR-014).
# 5 fallos seguidos en 15 minutos bloquean la cuenta 10 minutos. root NO se bloquea
# (sin even_deny_root): evita dejar el equipo sin acceso de recuperación.
# Sin 'silent': la persona VE que la cuenta está bloqueada, en vez de creer que olvidó la
# contraseña (mensajes honestos, ADR-009; revisión de #47).
# Desbloquear antes de tiempo: sudo faillock --user <usuario> --reset
deny = 5
fail_interval = 900
unlock_time = 600
audit
