name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  estructura:
    name: estructura
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verificar carpetas requeridas
        run: |
          set -euo pipefail
          requeridas=(
            docs/adr
            docs/documento-maestro
            docs/manuales
            iso/live-build
            iso/xfce4
            iso/calamares
            packages/nimbo-audit
            packages/nimbo-net
            security/luks-tpm
            security/air-gapped
            security/hardening
            repro
            apt-repo
            ci
            .github/workflows
          )
          faltan=0
          for dir in "${requeridas[@]}"; do
            if [ -d "$dir" ]; then
              echo "OK   $dir"
            else
              echo "FALTA $dir"
              faltan=1
            fi
          done
          if [ "$faltan" -ne 0 ]; then
            echo "::error::Faltan carpetas requeridas de la estructura del Paso 0."
            exit 1
          fi
          echo "Estructura completa."

  tests-cli-bookworm:
    # Tests de nimbo-audit con el Python 3.11 de bookworm y sus dependencias desde APT
    # (typer 0.7, click 8.1, pytest 7.2), en el mismo contenedor anclado que la ISO.
    # Job independiente: no toca `estructura`.
    name: tests-cli-bookworm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tests del CLI en bookworm (contenedor anclado)
        env:
          CONTAINER_ENGINE: docker
        run: ./packages/nimbo-audit/test-in-bookworm.sh

  tests-modulos-bookworm:
    # Tests de los módulos Python de Emmanuel con el Python 3.11 de bookworm y sus
    # dependencias desde APT, en el mismo contenedor anclado que la ISO (como el CLI).
    name: tests-modulos-bookworm (${{ matrix.modulo }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - modulo: nimbo-nav
            apt: ""
          - modulo: nimbo-update-offline
            apt: "gnupg"   # los tests generan claves efímeras con gpg y verifican con gpgv
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tests de ${{ matrix.modulo }} en bookworm (contenedor anclado)
        env:
          CONTAINER_ENGINE: docker
        run: ./ci/test-modulo-en-bookworm.sh packages/${{ matrix.modulo }} ${{ matrix.apt }}

  tests-build-scripts:
    # Tests de los scripts que envuelven live-build, sin contenedor ni red (segundos).
    # Existe porque auto/build terminaba con 0 aunque una etapa de lb fallara (5-nov).
    name: tests-build-scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Una etapa de live-build que falla hace fallar auto/build
        run: ./iso/live-build/tests/test-auto-build-falla.sh

      - name: Antes de live-build, todo config/ queda en SOURCE_DATE_EPOCH (H-004)
        run: ./iso/live-build/tests/test-auto-build-mtimes.sh

      - name: Calamares admite un equipo de 1 GiB (H-002)
        run: ./iso/live-build/tests/test-requisitos-calamares.sh

      - name: Espejo parcial del snapshot (ADR-016)
        run: python3 -I repro/espejo/test_espejo.py

      - name: El arnés borra su carpeta temporal (con la clave de prueba)
        run: ./iso/live-build/tests/test-arnes-limpia-temporales.sh
