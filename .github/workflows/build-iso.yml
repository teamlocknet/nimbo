name: build-iso

# Compila la ISO live en la nube reutilizando EXACTAMENTE el mismo build en
# contenedor Debian que en local (paridad dev/CI): build-in-container.sh con
# CONTAINER_ENGINE=docker. No reinventa la receta.
#
# NO compara builds ni persigue bit-idéntico (eso es el Paso 1C). No hace boot-test
# (los runners no tienen KVM).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["iso/live-build/**", "packages/nimbo-audit/**", "packages/nimbo-red/**", "packages/nimbo-update-offline/**", "security/hardening/3b2/**", "repro/espejo/**", ".github/workflows/build-iso.yml"]
  pull_request:
    branches: [main]
    paths: ["iso/live-build/**", "packages/nimbo-audit/**", "packages/nimbo-red/**", "packages/nimbo-update-offline/**", "security/hardening/3b2/**", "repro/espejo/**", ".github/workflows/build-iso.yml"]

# Cancela runs viejos de la misma rama: no encolar builds pesados en pushes seguidos.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-iso:
    name: build-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Metadatos (short SHA, SOURCE_DATE_EPOCH)
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Liberar espacio en disco del runner
        run: |
          echo "== Antes =="; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af || true
          echo "== Después =="; df -h /

      - name: Instalar xorriso (para validar la ISO)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xorriso

      # --- Espejo parcial del snapshot (ADR-016) ---------------------------------------
      # Los paquetes salen de repro/espejo/espejo.py (mismos bytes del snapshot, firma de
      # Debian intacta). La caché de Actions guarda lo descargado; como el snapshot es
      # inmutable, sirve cualquier caché anterior del mismo timestamp.
      - name: Espejo — timestamp del snapshot
        id: espejo
        run: |
          . iso/live-build/snapshot.env
          echo "snapshot=$NIMBO_SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Espejo — restaurar caché
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/nimbo-espejo
          key: espejo-${{ steps.espejo.outputs.snapshot }}-${{ github.run_id }}
          restore-keys: espejo-${{ steps.espejo.outputs.snapshot }}-

      - name: Espejo — arrancar
        run: repro/espejo/ci-espejo.sh arrancar

      - name: Construir la ISO en contenedor Debian (paridad con local)
        working-directory: iso/live-build
        env:
          CONTAINER_ENGINE: docker
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
          NIMBO_ESPEJO: http://127.0.0.1:8765
        run: ./build-in-container.sh

      - name: Espejo — resumen
        id: espejo_resumen
        if: always()
        run: repro/espejo/ci-espejo.sh resumen

      - name: Espejo — guardar caché (solo si hubo descargas)
        if: always() && steps.espejo_resumen.outputs.descargas != '0' && steps.espejo_resumen.outputs.descargas != ''
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/nimbo-espejo
          key: espejo-${{ steps.espejo.outputs.snapshot }}-${{ github.run_id }}-${{ github.run_attempt }}-build-iso

      - name: Validar la ISO
        working-directory: iso/live-build
        run: |
          set -euo pipefail
          ISO="$(ls live-image-*.iso)"
          echo ">> ISO: $ISO"
          file "$ISO"
          xorriso -indev "$ISO" -toc 2>/dev/null | head -20 || true
          bytes="$(stat -c%s "$ISO")"
          echo ">> Tamaño: $bytes bytes ($(du -h "$ISO" | cut -f1))"
          # Sanity: entre 100 MB y 2 GB (una ISO consola mínima ~260 MB).
          test "$bytes" -gt 104857600
          test "$bytes" -lt 2147483648
          echo ">> ISO válida."

      - name: Calcular SHA-256 (base para 1C)
        working-directory: iso/live-build
        run: |
          set -euo pipefail
          ISO="$(ls live-image-*.iso)"
          sha256sum "$ISO" | tee "$ISO.sha256"

      - name: Subir la ISO como artifact
        uses: actions/upload-artifact@v7
        with:
          name: nimbo-iso-${{ steps.meta.outputs.short_sha }}
          path: |
            iso/live-build/live-image-*.iso
            iso/live-build/live-image-*.iso.sha256
          if-no-files-found: error
          retention-days: 7
