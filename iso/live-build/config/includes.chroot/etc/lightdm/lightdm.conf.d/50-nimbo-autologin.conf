# 50-nimbo-autologin.conf — autologin del escritorio en la SESIÓN LIVE (Paso 3A).
#
# Por qué este fichero existe (y no basta live-config):
#   live-config 11.0.3 trae el script 0100-lightdm, pero escribe la sección OBSOLETA
#   [SeatDefaults], que lightdm 1.26 (bookworm) ya no lee (renombrada a [Seat:*]). Por
#   eso su autologin no prende y la ISO se queda en el greeter. Este drop-in usa la
#   sección CORRECTA y es determinista (no depende de la heurística de live-config).
#
# Por qué es config de PRODUCTO (no andamiaje de medición):
#   La ISO live está pensada para "instalar y usar el mismo día"; que arranque directo
#   al escritorio Xfce es la UX esperada de un medio live. El usuario 'nimbo' lo crea
#   live-config en el arranque (username=nimbo en el bootappend). El PAM de Debian
#   'lightdm-autologin' permite a cualquier no-root (pam_permit), así que NO hace falta
#   el grupo 'autologin' ni tocar PAM.
#
# NOTA DE SEGURIDAD (para 3B / hardening):
#   Autologin + usuario con sudo + contraseña por defecto 'live' es el estándar de un
#   medio LIVE efímero (idéntico a Debian Live). El sistema INSTALADO (vía Calamares +
#   LUKS/TPM) es el que lleva credenciales reales; ahí se revisa si el autologin sigue
#   siendo apropiado. Deuda anotada para el paso de hardening.

[Seat:*]
autologin-user=nimbo
autologin-user-timeout=0
autologin-session=xfce
