# GRUB + shim (ADR-006). Los paquetes los instala antes nimbo-arranque.sh desde el pool
# local; este módulo solo ejecuta grub-install / grub-mkconfig en el destino.
#
# efiBootloaderId "debian": la imagen FIRMADA de GRUB de Debian lleva embebido el prefijo
# /EFI/debian; con otro id el arranque con Secure Boot no encontraría su grub.cfg. Es un
# nombre de directorio en la ESP, no una marca: el slug `nimbo` no aplica aquí.
---
efiBootLoader: "grub"
efiBootloaderId: "debian"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: false
