# D14: el sistema INSTALADO no tiene autologin. doAutologin: false deja la casilla
# DESMARCADA por defecto; Calamares 3.3.8 no tiene opción para ocultarla. Sin módulo
# displaymanager y sin autologinGroup, aunque el usuario la marque nada lo aplica
# (lo comprueban nimbo-final.sh y verificar-instalado.sh).
#
# CONTRASEÑAS (decisión de Juan José, ADR-006): se SUGIERE una contraseña fuerte, no se
# obliga. allowWeakPasswords: true muestra la casilla "exigir contraseñas fuertes";
# allowWeakPasswordsDefault: false la deja MARCADA (con ella, mínimo 8 caracteres y aviso
# visible si no se cumple). Quien la desmarque puede usar la contraseña que quiera.
# Sin sudoersGroup: el sudoers de Debian ya concede %sudo; no se escribe /etc/sudoers.d.
---
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
setRootPassword: false
doReusePassword: false
doAutologin:     false
passwordRequirements:
    minLength: 8
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "nimbo"
  forbidden_names: [ localhost ]
