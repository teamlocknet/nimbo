# D14: el sistema INSTALADO no tiene autologin. doAutologin: false + sin módulo
# displaymanager + sin autologinGroup = aunque se marque la casilla, nada lo aplica.
# Sin sudoersGroup: el sudoers de Debian ya concede %sudo; no se escribe /etc/sudoers.d.
---
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
setRootPassword: false
doReusePassword: false
doAutologin:     false
passwordRequirements:
    minLength: 8
    maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "nimbo"
  forbidden_names: [ localhost ]
