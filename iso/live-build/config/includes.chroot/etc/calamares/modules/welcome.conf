# HERMETISMO: sin comprobación de internet, sin geoip, sin enlaces externos.
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
requirements:
    requiredStorage:    8.0
    # 1 GiB nominal (H-002, ADR-009): una máquina de 1 GiB le muestra a Calamares ~0.79 GiB.
    # Probado el 8-nov: instalado cifrado con 1 GiB, desbloquea (argon2id se calibra aquí).
    requiredRam:        0.75
    check:
        - storage
        - ram
        - root
    required:
        - storage
        - ram
        - root
geoip:
    style:    "none"
