# Idioma y zona horaria del sistema instalado (3C.2, ADR-017).
#
# HERMETISMO: geoip desactivado (style: none) y sin url: la pantalla no sale a la red. La
# zona por defecto es la del equipo (Colombia); el idioma lo propone Calamares según el
# país de la zona (es_CO.UTF-8) y el usuario puede cambiar los dos. `localecfg` genera en
# el destino solo el idioma elegido.
---
region:                 "America"
zone:                   "Bogota"
# No tocar la hora de la sesión live al elegir zona (solo se configura el destino).
adjustLiveTimezone:     false
geoip:
    style:    "none"
