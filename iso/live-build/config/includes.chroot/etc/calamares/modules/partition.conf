# Particionado guiado de nimbo (ADR-006): ESP + /boot ext4 EN CLARO + raíz ext4 sobre LUKS2.
# GRUB nunca abre el LUKS (2.06 no soporta argon2), así que el KDF es el de cryptsetup
# 2.6.1 por defecto (argon2id) y `nimbo-tpm-setup` puede añadir después un token TPM2.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

# Sin swap en 3C.1: una partición de swap en claro filtraría memoria (swapfile → 3C.2).
userSwapChoices:
    - none
initialSwapChoice: none

# LUKS2: requisito de systemd-cryptenroll (D17). El valor por defecto de 3.3.8 es luks1.
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
# La casilla "cifrar sistema" viene MARCADA; el usuario puede desmarcarla (cifrado opcional).
preCheckEncryption: true
# /boot en claro es deliberado (ADR-006): no avisar de ello como si fuera un error.
showNotEncryptedBootMessage: false

# Sin particionado manual en 3C.1: el invariante "/boot claro + raíz LUKS2" no debe
# depender de lo que arme el usuario a mano.
allowManualPartitioning: false
initialPartitioningChoice: erase

drawNestedPartitions:      false
alwaysShowPartitionLabels: true
defaultFileSystemType:     "ext4"
availableFileSystemTypes:  [ "ext4" ]

partitionLayout:
    - name: "boot"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1GiB
    - name: "root"
      filesystem: "ext4"
      noEncrypt: false
      mountPoint: "/"
      size: 100%
