# /etc/calamares/settings.conf — instalador de nimbo (Paso 3C.1, ADR-006).
#
# Config PROPIA y mínima; no se usa calamares-settings-debian (su flujo instala GRUB con
# apt desde un pool en el medio y deja un sources.list con mirrors remotos y backports).
# Todo el directorio /etc/calamares es LIVE-ONLY: lo borra nimbo-final.sh en el destino.
#
# FUERA A PROPÓSITO (3C.1):
#   - displaymanager : el instalador no puede activar autologin (D14).
#   - locale/localecfg: sin geoip ni `locales`; el instalado queda en C.UTF-8 y UTC (3C.2).
#   - networkcfg, packages: nada de red; la limpieza la hace nimbo-final.sh desde una
#     ÚNICA lista (/usr/lib/nimbo/calamares/solo-instalador.list).
#   - luksbootkeyfile: /boot va en claro, no hay keyfile que generar (ADR-006).
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       nimbo-arranque
  module:   shellprocess
  config:   shellprocess_nimbo-arranque.conf
- id:       nimbo-final
  module:   shellprocess
  config:   shellprocess_nimbo-final.conf

sequence:
- show:
  - welcome
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - keyboard
  - users
  - hwclock
  - shellprocess@nimbo-arranque
  - grubcfg
  - bootloader
  - shellprocess@nimbo-final
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished

branding: nimbo
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
