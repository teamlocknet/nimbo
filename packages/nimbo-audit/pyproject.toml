# MÍNIMOS = VERSIONES DE BOOKWORM (ADR-005). La ISO es offline y el CLI corre con lo que
# trae Debian bookworm, no con lo último de PyPI. Los pisos de este archivo son los
# paquetes del snapshot anclado 20260901T000000Z (iso/live-build/snapshot.env):
#   python3 3.11.2 · python3-setuptools 66.1.1 · python3-typer 0.7.0 · python3-pytest 7.2.1
# No subirlos sin comprobar que bookworm los trae: el job `tests-cli-bookworm` del CI
# (packages/nimbo-audit/test-in-bookworm.sh) corre los tests contra esas versiones.
[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbo-audit"
version = "0.1.0"
description = "CLI de auditoría del sistema (codename nimbo): init/capture/report de engagements con evidencia verificable."
readme = "README.md"
# Debian bookworm (rama LTS, ADR-005) trae Python 3.11; no usamos features > 3.11.
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "typer>=0.7",   # python3-typer 0.7.0 en bookworm (ADR-005)
]

[project.optional-dependencies]
test = ["pytest>=7.2"]   # python3-pytest 7.2.1 en bookworm (ADR-005)

[project.scripts]
# El comando es 'nimbo-audit'; el namespace del paquete es 'nimbo_audit'
# (slug canónico renombrable con un find-and-replace global).
nimbo-audit = "nimbo_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
