[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbo-net"
version = "0.1.0"
description = "Red privada WireGuard de nimbo solo a demanda"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.2"]

[project.scripts]
nimbo-net = "nimbo_net.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
